name: EagleAI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-regression:
    name: Python syntax and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            eagle_api.py \
            eagle_regresyon_test.py

      - name: Run regression tests
        run: python eagle_regresyon_test.py

  android-compile:
    name: Android Java compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: android

      - name: Remove Termux-only AAPT2 override
        run: sed -i "/^android.aapt2FromMavenOverride=/d" gradle.properties
        working-directory: android

      - name: Compile Android app
        run: ./gradlew --no-daemon compileDebugJavaWithJavac
        working-directory: android
